services:
  frontend:
    build:
      context: .
      args:
        # These come from the .env file in this directory and are baked into the
        # build (NEXT_PUBLIC_* are client-side, so they must be set at build time).
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_MEDIA_URL: ${NEXT_PUBLIC_MEDIA_URL}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
        NEXT_PUBLIC_SITE_NAME: ${NEXT_PUBLIC_SITE_NAME}
    container_name: sankofax_frontend
    restart: always
    ports:
      - "3000:3000"
